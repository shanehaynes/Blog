<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body {
      font-family: "Lora", serif;
      background: #F8F7F4;
      color: #222;
      text-align: center;
      padding-top: 100px;
    }
    input {
      padding: 12px;
      font-size: 18px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #234f1e;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #status {
      margin-top: 20px;
      font-size: 16px;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <h1>Reset your password</h1>
  <input type="password" id="new-password" placeholder="New password" />
  <br>
  <button onclick="updatePassword()">Update Password</button>
  <p id="status"></p>

  <script>
    const supabaseClient = supabase.createClient(
      'https://uuyssskuvvhypyxeytnb.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1eXNzc2t1dnZoeXB5eGV5dG5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQwNDMwNjksImV4cCI6MjA1OTYxOTA2OX0.itmpBTE5Z8OjQGkLTER9wrSncqIw2_01fEW7Q3nSg_A'
    );

    async function updatePassword() {
      const newPassword = document.getElementById("new-password").value;
      const statusText = document.getElementById("status");
      statusText.textContent = 'Processing...';

      const {
        data: { session },
        error: sessionError
      } = await supabaseClient.auth.getSession();

      if (!session || sessionError) {
        statusText.textContent = "❌ No valid session found. Please use the password reset link from your email again.";
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

      if (error) {
        statusText.textContent = `❌ Password update failed: ${error.message}`;
      } else {
        statusText.textContent = "✅ Password updated successfully. You may now close this tab and log in from the login page.";
      }
    }
  </script>
</body>
</html>
