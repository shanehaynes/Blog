<h1>Login to Phil Inc</h1>

<div id="auth-section">
  <input class="email-input" id="email" type="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />
  <button onclick="signUp()">Sign Up</button>
  <button onclick="signIn()">Log In</button>
  <a href="#" class="forgot-link" onclick="showForgotPassword()">Forgot password?</a>
</div>

<p id="auth-status"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
 <style>
    body {
      font-family: "Lora", serif;
      background: #F8F7F4;
      color: #222;
      text-align: center;
    }
    input {
      padding: 12px;
      font-size: 18px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    button {
      margin-top: 3%;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #234f1e;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #status {
      margin-top: 20px;
      font-size: 16px;
      min-height: 24px;
    }
    h1{
      margin-top: 7%;
    }
  </style>
<script>

  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const authSection = document.getElementById('auth-section');
  const statusText = document.getElementById('auth-status');

  document.addEventListener("DOMContentLoaded", async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session && session.user) {
    window.location.href = "/profile/";
  }
});

  // Dynamically create logout link if signed in
  const logoutLink = document.createElement('a');
  logoutLink.href = "#";
  logoutLink.textContent = "Log out";
  logoutLink.style.display = "inline-block";
  logoutLink.style.marginTop = "10px";
  logoutLink.onclick = async (e) => {
    e.preventDefault();
    await supabaseClient.auth.signOut();
    statusText.textContent = "Logged out.";
    authSection.style.display = 'block';
    logoutLink.remove();
  };

async function signUp() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const statusText = document.getElementById('auth-status');

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password
  });

  if (error) {
    statusText.textContent = `❌ Sign up failed: ${error.message}`;
  } else {
    statusText.textContent = "✅ Sign up successful! Check your email to confirm.";
  }
}


async function signIn() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const statusText = document.getElementById('auth-status');

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    statusText.textContent = `❌ Login failed: ${error.message}`;
  } else {
    statusText.textContent = `✅ Login successful! Redirecting...`;
    setTimeout(() => {
      window.location.href = "/profile/";
    }, 1000); // slight delay to show message
  }
}


  async function updateUIOnAuth() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session && session.user) {
      authSection.style.display = 'none';
      statusText.textContent = `Welcome, ${session.user.email}`;
      // Show logout link
      if (!document.body.contains(logoutLink)) {
        document.body.appendChild(logoutLink);
      }
    } else {
      authSection.style.display = 'block';
      statusText.textContent = '';
      if (document.body.contains(logoutLink)) {
        logoutLink.remove();
      }
    }
  }

  updateUIOnAuth();

  function showForgotPassword() {
  const email = prompt("Enter your email to reset your password:");
  if (!email) return;

  supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: 'http://localhost:4000/reset-password.html'
  }).then(({ error }) => {
    if (error) {
      alert('❌ ' + error.message);
    } else {
      alert('Password reset link sent! Check your email.');
    }
  });
}
</script>
